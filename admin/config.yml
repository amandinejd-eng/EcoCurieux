# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

locale: fr
app_title: Modifier le site
site_url: https://ecocurieux.com
display_url: https://ecocurieux.com
logout_redirect_url: https://ecocurieux.com

logo:
  src: /images-creation-de-site/logo.png
  show_in_header: true

backend:
  name: github
  repo: amandinejd-eng/EcoCurieux
  branch: main
  base_url: https://ecocurieux.com
  auth_endpoint: auth
  auth_methods: [oauth]
  commit_messages:
    create: "CMS : création de {{collection}} « {{slug}} »"
    update: "CMS : mise à jour de {{collection}} « {{slug}} »"
    delete: "CMS : suppression de {{collection}} « {{slug}} »"
    uploadMedia: "CMS : ajout de l’image {{path}}"
    deleteMedia: "CMS : suppression de l’image {{path}}"

media_folder: images-cms
public_folder: /images-cms

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: apparence
    label: Apparence
    icon: palette
    description: "Couleurs, polices, logo et coordonnées visibles partout sur le site."
    files:
      - name: theme
        label: Identité du site
        icon: brush
        file: contenu/theme.json
        preview_path: /
        fields:
          - label: Nom du site
            name: nom
            widget: string
            hint: "Affiché dans l’en-tête et l’onglet du navigateur."
          - label: Slogan
            name: slogan
            widget: string
          - label: Nom affiché
            name: auteur
            widget: string
            hint: "Par exemple Amandine Junier-Dubus."
          - label: Email
            name: email
            widget: string
            type: email
          - label: Téléphone
            name: telephone
            widget: string
            hint: "Tu peux garder les points, comme 06.69.49.18.23."
          - label: Zone géographique
            name: zone
            widget: string
          - label: Logo
            name: logo
            widget: image
            hint: "Idéalement un fond transparent."
          - label: Couleurs
            name: colors
            widget: object
            collapsed: false
            summary: "{{green}} · {{brown}}"
            comment: "Ces couleurs s’appliquent à tout le site. Clique sur le carré pour choisir."
            fields:
              - { label: Vert, name: green, widget: color, allowInput: true, hint: "Boutons, accents, dates." }
              - { label: Vert foncé, name: greenDark, widget: color, allowInput: true, hint: "Titres et menu." }
              - { label: Brun, name: brown, widget: color, allowInput: true }
              - { label: Beige, name: beige, widget: color, allowInput: true }
              - { label: Beige 2, name: beige2, widget: color, allowInput: true, hint: "Bordures et filets." }
              - { label: Fond beige clair, name: beigeLight, widget: color, allowInput: true }
          - label: Polices
            name: fonts
            widget: object
            collapsed: false
            comment: "Polices Google Fonts. Le site les charge tout seul."
            fields:
              - label: Police des titres
                name: titres
                widget: select
                options: [Montserrat, Nunito, Poppins, Playfair Display, Merriweather, Quicksand, Roboto, Open Sans, Lora, Caveat]
              - label: Police du texte
                name: texte
                widget: select
                options: [Lora, Merriweather, Open Sans, Roboto, Nunito, Montserrat, Playfair Display, Quicksand, Poppins, Caveat]
              - label: Police du logo
                name: logo
                widget: select
                options: [Nunito, Montserrat, Poppins, Playfair Display, Caveat, Quicksand, Lora, Merriweather, Roboto, Open Sans]

  - divider: true

  - name: evenements
    label: Événements
    icon: calendar_month
    description: "Tu peux tout détailler : titre, emoji, couleurs, photos (place, cadrage, rotation), programme. La **date** classe toute seule l’événement en À venir ou Passés. Clique **Publier**, attends une minute, puis rafraîchis le site."
    files:
      - name: agenda
        label: Agenda
        icon: event
        file: evenements.json
        preview_path: evenements.html
        fields:
          - label: Événements à venir
            name: upcoming
            widget: list
            label_singular: événement
            summary: "{{emoji}} {{title}} — {{date}}"
            collapsed: auto
            add_to_top: true
            comment: "Même fiche complète que les passés : photos, couleurs, programme… Seule la date décide où ça s’affiche sur le site."
            fields: &event_fields
              - { name: id, widget: hidden }
              - label: Date
                name: date
                widget: datetime
                type: date
                format: YYYY-MM-DD
                default: "{{now}}"
                hint: "C’est cette date qui s’affiche et qui classe l’événement (à venir ou passé)."
                comment: "📅 L’essentiel"
              - label: Emoji
                name: emoji
                widget: string
                required: false
                hint: "Copie-colle un emoji, par exemple 🐦. Il s’affiche devant le titre."
              - label: Titre
                name: title
                widget: string
                hint: "Le nom de l’événement. Tu peux aussi mettre l’emoji dans le titre si tu préfères."
              - label: Sous-titre
                name: subtitle
                widget: string
                required: false
                hint: "Petite phrase sous le titre, optionnelle."
              - label: Lieu
                name: location
                widget: string
                hint: "Ville, structure, ou par exemple « Anniversaire 5 ans »."
              - label: Description
                name: description
                widget: text
                hint: "Texte principal. Un saut de ligne = un nouveau paragraphe. Entoure un mot de **deux étoiles** pour le mettre en gras."
                comment: "📝 Les textes"
              - label: Encadré mis en avant
                name: details
                widget: string
                required: false
                hint: "Petite phrase dans un encadré coloré (un plus, un atelier bonus…)."
              - label: Récapitulatif
                name: recap
                widget: text
                required: false
                hint: "Texte plus long dans le détail (souvenirs, bilan de l’animation…)."
              - label: Note de fin
                name: footer
                widget: text
                required: false
                hint: "Phrase discrète tout en bas de la fiche."
              - label: Horaires
                name: time
                widget: string
                required: false
                hint: "Exemple : 10h-18h"
                comment: "ℹ️ Infos pratiques — pastilles à droite de la fiche."
              - label: Public
                name: audience
                widget: string
                required: false
                default: "Tout public"
              - label: Tarif
                name: price
                widget: string
                required: false
                default: "Sur devis"
              - label: Couleur d’accent
                name: couleur
                widget: color
                required: false
                allowInput: true
                hint: "Filet, dates et pastilles. Vide = vert (à venir) ou brun (passé)."
                comment: "🎨 Couleurs et icône"
              - label: Couleur du titre
                name: couleurTitre
                widget: color
                required: false
                allowInput: true
                hint: "Laisse vide pour garder le vert foncé du site."
              - label: Icône décorative
                name: icone
                widget: string
                required: false
                hint: "Petit emoji en filigrane en haut à droite, par exemple 🍃 ou 🐦."
              - label: Photos
                name: photos
                widget: list
                required: false
                label_singular: photo
                summary: "{{caption}}"
                thumbnail: url
                collapsed: auto
                comment: "📷 Place chaque photo comme tu veux. Celle marquée « Photo principale » (sinon la première) s’affiche en grand. Les autres forment la galerie. Glisse pour changer l’ordre."
                fields:
                  - label: Photo
                    name: url
                    widget: image
                    choose_url: true
                    hint: "Envoie une image depuis ton ordinateur, ou colle un lien."
                  - label: Légende
                    name: caption
                    widget: string
                    required: false
                    hint: "Texte au survol et sous la photo."
                  - label: Rôle
                    name: role
                    widget: select
                    required: false
                    default: galerie
                    options:
                      - { label: "Photo principale (grande, à côté du texte)", value: principale }
                      - { label: "Galerie (dans le détail)", value: galerie }
                  - label: Place de la photo principale
                    name: position
                    widget: select
                    required: false
                    default: gauche
                    hint: "S’applique à la photo principale."
                    options:
                      - { label: "À gauche du texte", value: gauche }
                      - { label: "À droite du texte", value: droite }
                      - { label: "Au-dessus du texte", value: haut }
                      - { label: "Toute la largeur", value: pleine }
                  - label: Cadrage
                    name: cadrage
                    widget: select
                    required: false
                    default: contenir
                    options:
                      - { label: "Voir toute la photo (sans couper)", value: contenir }
                      - { label: "Remplir le cadre (peut couper les bords)", value: remplir }
                  - label: Zone visible
                    name: focus
                    widget: select
                    required: false
                    default: centre
                    hint: "Si tu remplis le cadre, choisis la partie à garder."
                    options:
                      - { label: "Centre", value: centre }
                      - { label: "Haut", value: haut }
                      - { label: "Bas", value: bas }
                      - { label: "Gauche", value: gauche }
                      - { label: "Droite", value: droite }
                  - label: Rotation
                    name: rotation
                    widget: select
                    required: false
                    default: "0"
                    options:
                      - { label: "Aucune", value: "0" }
                      - { label: "90° à droite", value: "90" }
                      - { label: "180°", value: "180" }
                      - { label: "90° à gauche", value: "270" }
              - label: Style de la galerie
                name: galerie
                widget: select
                required: false
                default: bande
                options:
                  - { label: "Bandeau horizontal (on fait défiler)", value: bande }
                  - { label: "Grille", value: grille }
              - label: Titre du programme
                name: titreProgramme
                widget: string
                required: false
                default: "Au programme"
                hint: "Par défaut : Au programme."
                comment: "🎯 Programme — les étapes de l’animation."
              - label: Emoji du programme
                name: emojiProgramme
                widget: string
                required: false
                default: "🎯"
              - label: Programme
                name: program
                widget: list
                required: false
                label_singular: étape
                summary: "{{emoji}} {{title}}"
                collapsed: auto
                fields:
                  - label: Emoji
                    name: emoji
                    widget: string
                    required: false
                    hint: "Un emoji par étape, par exemple 🥚 ou 🧪."
                  - label: Titre
                    name: title
                    widget: string
                  - label: Description
                    name: description
                    widget: text
                    hint: "Un saut de ligne = un nouveau paragraphe. **gras** possible."
                  - label: Couleur
                    name: couleur
                    widget: color
                    required: false
                    allowInput: true
                    hint: "Barre en haut de la carte. Vide = vert du site."
          - label: Événements passés
            name: past
            widget: list
            label_singular: événement
            summary: "{{emoji}} {{title}} — {{date}}"
            collapsed: auto
            comment: "Mêmes réglages que ci-dessus. Si tu mets une date encore à venir, l’événement remonte tout seul dans l’agenda."
            fields: *event_fields

  - divider: true

  - name: pages
    label: Pages
    icon: web
    description: "Textes, photos, couleurs et emojis de chaque page. Clique une page, puis **Publier**."
    files:
      - name: accueil
        label: Accueil
        icon: home
        file: contenu/accueil.json
        preview_path: /
        fields:
          - label: Bannière d’accueil
            name: hero
            widget: object
            collapsed: false
            summary: "{{titreAvant}} {{titreAccent}}"
            fields:
              - { label: Badge, name: badge, widget: string, hint: "Petite pastille au-dessus du titre, ex. le lieu." }
              - { label: Début du titre, name: titreAvant, widget: string }
              - { label: Mot en couleur, name: titreAccent, widget: string, hint: "Ce mot s’affiche en couleur." }
              - { label: Couleur de ce mot, name: couleurAccent, widget: color, required: false, allowInput: true, hint: "Laisse vide pour garder le vert du site." }
              - { label: Sous-titre, name: sousTitre, widget: string }
              - { label: Texte d’intro, name: texte, widget: text }
              - { label: Bouton 1, name: bouton1, widget: string }
              - { label: Bouton 2, name: bouton2, widget: string }
          - label: Bulles photos
            name: bulles
            widget: list
            label_singular: bulle
            summary: "{{texte}}"
            thumbnail: image
            collapsed: auto
            fields:
              - { label: Photo, name: image, widget: image }
              - { label: Texte, name: texte, widget: text, hint: "Texte au survol de la bulle." }
              - { label: Emoji, name: emoji, widget: string, required: false, hint: "Optionnel, affiché sur la bulle." }
          - label: Bandeau défilant
            name: bandeau
            widget: list
            label_singular: phrase
            comment: "Les phrases défilent en bas de la bannière."
            field: { label: Texte, name: texte, widget: string }
          - label: Qui suis-je
            name: qui
            widget: object
            collapsed: auto
            summary: "{{titre}}"
            fields:
              - { label: Étiquette, name: label, widget: string }
              - { label: Titre, name: titre, widget: string }
              - { label: Photo, name: photo, widget: image }
              - { label: Paragraphe 1, name: p1, widget: text, hint: "Le HTML simple est possible, par exemple **gras** via les balises." }
              - { label: Paragraphe 2, name: p2, widget: text }
              - { label: Paragraphe 3, name: p3, widget: text }
          - label: Ma démarche
            name: demarche
            widget: object
            collapsed: auto
            summary: "{{titre}} {{titreAccent}}"
            fields:
              - { label: Étiquette, name: label, widget: string }
              - { label: Titre, name: titre, widget: string }
              - { label: Mot en couleur, name: titreAccent, widget: string }
              - { label: Couleur de ce mot, name: couleurAccent, widget: color, required: false, allowInput: true }
              - { label: Intro, name: intro, widget: string }
              - { label: Citation, name: citation, widget: text }
              - { label: Auteur de la citation, name: citationAuteur, widget: string }
              - label: Piliers
                name: piliers
                widget: list
                label_singular: pilier
                summary: "{{titre}}"
                collapsed: auto
                fields:
                  - { label: Emoji, name: emoji, widget: string, required: false }
                  - { label: Titre, name: titre, widget: string }
                  - { label: Texte, name: texte, widget: text }
                  - { label: Couleur, name: couleur, widget: color, required: false, allowInput: true, hint: "Barre à gauche du pilier." }
              - label: Valeurs
                name: valeurs
                widget: list
                label_singular: valeur
                summary: "{{emoji}} {{texte}}"
                collapsed: auto
                fields:
                  - { label: Emoji, name: emoji, widget: string, required: false }
                  - { label: Texte, name: texte, widget: string }
          - label: Encadré agenda
            name: agenda
            widget: object
            collapsed: auto
            summary: "{{titre}}"
            fields:
              - { label: Badge, name: badge, widget: string }
              - { label: Titre, name: titre, widget: string }
              - { label: Texte, name: texte, widget: text }
              - { label: Bouton, name: bouton, widget: string }
          - label: Garanties
            name: garanties
            widget: list
            label_singular: garantie
            summary: "{{emoji}} {{titre}}"
            collapsed: auto
            fields:
              - { label: Emoji, name: emoji, widget: string, required: false }
              - { label: Titre, name: titre, widget: string }
              - { label: Sous-texte, name: sous, widget: string }
              - { label: Couleur, name: couleur, widget: color, required: false, allowInput: true }

      - name: animations
        label: Animations
        icon: spa
        file: contenu/animations.json
        preview_path: animations.html
        fields:
          - { label: Badge, name: badge, widget: string }
          - { label: Titre, name: titre, widget: string }
          - { label: Mot en couleur, name: titreAccent, widget: string }
          - { label: Couleur de ce mot, name: couleurAccent, widget: color, required: false, allowInput: true }
          - { label: Fin du titre, name: titreFin, widget: string }
          - { label: Sous-titre, name: sousTitre, widget: text }
          - label: Atelier nature
            name: atelier
            widget: object
            collapsed: auto
            summary: "{{titre}} {{titreAccent}}"
            fields:
              - { label: Photo, name: photo, widget: image }
              - { label: Titre, name: titre, widget: string }
              - { label: Mot en couleur, name: titreAccent, widget: string }
              - { label: Couleur de ce mot, name: couleurAccent, widget: color, required: false, allowInput: true }
              - { label: Intro, name: intro, widget: text }
              - { label: Accroche, name: accroche, widget: text }
              - { label: Puces, name: puces, widget: list, label_singular: puce, field: { label: Texte, name: texte, widget: string } }
              - { label: Étiquettes, name: etiquettes, widget: list, label_singular: étiquette, field: { label: Texte, name: texte, widget: string } }
              - { label: Intro catalogue, name: catalogueIntro, widget: text }
              - label: Thématiques
                name: themes
                widget: list
                label_singular: thématique
                summary: "{{emoji}} {{titre}}"
                collapsed: auto
                fields:
                  - { label: Emoji, name: emoji, widget: string, required: false }
                  - { label: Titre, name: titre, widget: string }
                  - { label: Texte, name: texte, widget: text }
                  - { label: Couleur, name: couleur, widget: color, required: false, allowInput: true }
          - label: Anniversaires
            name: anniversaires
            widget: object
            collapsed: auto
            summary: "{{titre}} {{titreAccent}}"
            fields:
              - { label: Photo, name: photo, widget: image }
              - { label: Titre, name: titre, widget: string }
              - { label: Mot en couleur, name: titreAccent, widget: string }
              - { label: Couleur de ce mot, name: couleurAccent, widget: color, required: false, allowInput: true }
              - { label: Intro, name: intro, widget: text }
              - { label: Accroche, name: accroche, widget: string }
              - { label: Conclusion, name: conclusion, widget: text }
              - { label: Bouton, name: bouton, widget: string }
              - label: Univers
                name: univers
                widget: list
                label_singular: univers
                summary: "{{emoji}} {{titre}}"
                collapsed: auto
                fields:
                  - { label: Emoji, name: emoji, widget: string, required: false }
                  - { label: Titre, name: titre, widget: string }
                  - { label: Texte, name: texte, widget: text }
                  - { label: Couleur, name: couleur, widget: color, required: false, allowInput: true }
          - label: Stages
            name: stages
            widget: object
            collapsed: auto
            summary: "{{titre}} {{titreAccent}}"
            fields:
              - { label: Photo, name: photo, widget: image }
              - { label: Titre, name: titre, widget: string }
              - { label: Mot en couleur, name: titreAccent, widget: string }
              - { label: Couleur de ce mot, name: couleurAccent, widget: color, required: false, allowInput: true }
              - { label: Intro, name: intro, widget: text }
              - { label: Accroche, name: accroche, widget: text }
              - { label: Encadré carnet, name: carnet, widget: text }
              - { label: Infos, name: infos, widget: list, label_singular: info, field: { label: Texte, name: texte, widget: string } }
              - { label: Note, name: note, widget: text }
              - { label: Bouton, name: bouton, widget: string }

      - name: pour_qui
        label: Pour qui ?
        icon: groups
        file: contenu/pour-qui.json
        preview_path: pour-qui.html
        fields:
          - { label: Étiquette, name: label, widget: string }
          - { label: Titre, name: titre, widget: string }
          - { label: Mot en couleur, name: titreAccent, widget: string }
          - { label: Couleur de ce mot, name: couleurAccent, widget: color, required: false, allowInput: true }
          - label: Cartes
            name: cartes
            widget: list
            label_singular: carte
            summary: "{{emoji}} {{titre}}"
            thumbnail: photo
            collapsed: auto
            fields:
              - { label: Emoji, name: emoji, widget: string, required: false }
              - { label: Titre, name: titre, widget: string }
              - { label: Texte, name: texte, widget: text }
              - { label: Photo de fond, name: photo, widget: image, required: false }
              - { label: Couleur, name: couleur, widget: color, required: false, allowInput: true, hint: "Teinte du dégradé sur la photo. Vide = vert ou brun automatique." }
              - { label: Étiquettes, name: etiquettes, widget: list, label_singular: étiquette, field: { label: Texte, name: texte, widget: string } }

      - name: contact
        label: Contact
        icon: mail
        file: contenu/contact.json
        preview_path: contact.html
        fields:
          - { label: Petite ligne au-dessus du titre, name: eyebrow, widget: string }
          - { label: Titre (ligne 1), name: titre1, widget: string }
          - { label: Mot en italique, name: titreAccent, widget: string }
          - { label: Intro, name: intro, widget: text }
          - { label: Mention RC, name: rc, widget: string }
          - { label: Titre du formulaire, name: formTitre, widget: string }
          - { label: QR Facebook, name: qrFacebook, widget: image }
          - { label: QR Instagram, name: qrInstagram, widget: image }

      - name: kits
        label: Kits pédagogiques
        icon: inventory_2
        file: contenu/kits.json
        preview_path: kits/index.html
        fields:
          - label: Page d’accueil des kits
            name: index
            widget: object
            collapsed: false
            summary: "{{titre}} {{titreAccent}}"
            fields:
              - { label: Titre, name: titre, widget: string }
              - { label: Mot en couleur, name: titreAccent, widget: string }
              - { label: Couleur de ce mot, name: couleurAccent, widget: color, required: false, allowInput: true }
              - { label: Intro, name: intro, widget: text }
              - { label: Texte d’info, name: info, widget: text }
              - { label: Pastilles, name: pastilles, widget: list, label_singular: pastille, field: { label: Texte, name: texte, widget: string } }
              - { label: Bouton, name: bouton, widget: string }
          - label: Fiches kits
            name: fiches
            widget: list
            label_singular: kit
            summary: "{{titre}}"
            thumbnail: photo
            collapsed: auto
            comment: "Ne change l’identifiant que si tu sais à quelle page il est relié (couveuse, mante, phasmes)."
            fields:
              - { label: Identifiant, name: id, widget: string, hint: "couveuse, mante ou phasmes — à ne pas modifier." }
              - { label: Titre, name: titre, widget: string }
              - { label: Mot en couleur, name: titreAccent, widget: string }
              - { label: Couleur de ce mot, name: couleurAccent, widget: color, required: false, allowInput: true }
              - { label: Emoji, name: emoji, widget: string, required: false }
              - { label: Sous-titre, name: sousTitre, widget: string }
              - { label: Photo carte, name: photo, widget: image }
              - { label: Texte carte, name: texteCarte, widget: text }
              - { label: Description, name: description, widget: text, hint: "Un paragraphe par ligne." }
              - { label: Contenu du kit, name: contenu, widget: text, hint: "Une ligne = un point de la liste." }
              - { label: Durée, name: duree, widget: string }
              - { label: Public, name: public, widget: string }
              - { label: Zone, name: zone, widget: string }
              - { label: Tarif, name: tarif, widget: string }
              - { label: Titre du bouton de réservation, name: ctaTitre, widget: string }
              - { label: Texte du bouton de réservation, name: ctaTexte, widget: text }
