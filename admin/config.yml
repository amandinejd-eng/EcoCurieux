            fields:
              - { label: Page visible, name: visible, widget: boolean, default: true, hint: "Décoche pour la cacher sans la supprimer." }
              - { label: Afficher dans le menu, name: afficherMenu, widget: boolean, default: false, hint: "Ajoute la page à la fin du menu." }
              - { label: Adresse de la page, name: slug, widget: string, hint: "Lettres minuscules, tirets. Exemple : partenaires → ecocurieux.com/p/partenaires" }
