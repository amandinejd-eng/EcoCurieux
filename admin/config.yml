# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

locale: fr
app_title: Studio Écocurieux
site_url: https://ecocurieux.com
display_url: https://ecocurieux.com
logout_redirect_url: https://ecocurieux.com

logo:
  src: /images-creation-de-site/logo.png
  show_in_header: true

backend:
  name: github
  repo: amandinejd-eng/EcoCurieux
  branch: main
  base_url: https://ecocurieux.com
  auth_endpoint: auth
  auth_methods: [oauth]
  commit_messages:
    create: "CMS : création de {{collection}} « {{slug}} »"
    update: "CMS : mise à jour de {{collection}} « {{slug}} »"
    delete: "CMS : suppression de {{collection}} « {{slug}} »"
    uploadMedia: "CMS : ajout de l’image {{path}}"
    deleteMedia: "CMS : suppression de l’image {{path}}"

media_folder: images-cms
public_folder: /images-cms

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: apparence
    label: 01 · Identité
    icon: palette
    description: "Logo, couleurs, coordonnées, et le menu du site."
    files:
      - name: theme
        label: Logo, couleurs, contact
        icon: brush
        file: contenu/theme.json
        preview_path: /
        fields:
          - label: Nom du site
            name: nom
            widget: string
            hint: "Affiché dans l’en-tête et l’onglet du navigateur."
          - label: Slogan
            name: slogan
            widget: string
          - label: Nom affiché
            name: auteur
            widget: string
            hint: "Par exemple Amandine Junier-Dubus."
          - label: Email
            name: email
            widget: string
            type: email
          - label: Téléphone
            name: telephone
            widget: string
            hint: "Tu peux garder les points, comme 06.69.49.18.23."
          - label: Zone géographique
            name: zone
            widget: string
          - label: Logo
            name: logo
            widget: image
            hint: "Idéalement un fond transparent."
          - label: Couleurs
            name: colors
            widget: object
            collapsed: false
            summary: "{{green}} · {{brown}}"
            comment: "Ces couleurs s’appliquent à tout le site. Clique sur le carré pour choisir."
            fields:
              - { label: Vert, name: green, widget: color, allowInput: true, hint: "Boutons, accents, dates." }
              - { label: Vert foncé, name: greenDark, widget: color, allowInput: true, hint: "Titres et menu." }
              - { label: Brun, name: brown, widget: color, allowInput: true }
              - { label: Beige, name: beige, widget: color, allowInput: true }
              - { label: Beige 2, name: beige2, widget: color, allowInput: true, hint: "Bordures et filets." }
              - { label: Fond beige clair, name: beigeLight, widget: color, allowInput: true }
          - label: Polices
            name: fonts
            widget: object
            collapsed: false
            comment: "Polices Google Fonts. Le site les charge tout seul."
            fields:
              - label: Police des titres
                name: titres
                widget: select
                options: [Montserrat, Nunito, Poppins, Playfair Display, Merriweather, Quicksand, Roboto, Open Sans, Lora, Caveat]
              - label: Police du texte
                name: texte
                widget: select
                options: [Lora, Merriweather, Open Sans, Roboto, Nunito, Montserrat, Playfair Display, Quicksand, Poppins, Caveat]
              - label: Police du logo
                name: logo
                widget: select
                options: [Nunito, Montserrat, Poppins, Playfair Display, Caveat, Quicksand, Lora, Merriweather, Roboto, Open Sans]

      - name: menu
        label: Menu
        icon: menu
        file: contenu/navigation.json
        preview_path: /
        fields:
          - label: Bouton « Me contacter »
            name: cta
            widget: object
            collapsed: false
            summary: "{{emoji}} {{label}}"
            fields:
              - { label: Visible, name: visible, widget: boolean, default: true }
              - { label: Emoji, name: emoji, widget: emoji, required: false }
              - { label: Texte, name: label, widget: string }
              - { label: Lien, name: href, widget: string, hint: "En général /contact.html" }
          - label: Liens du menu
            name: items
            widget: list
            label_singular: lien
            summary: "{{emoji}} {{label}}"
            collapsed: auto
            comment: "Glisse pour changer l’ordre. Décoche Visible pour retirer un lien. Une page nouvelle se crée dans 04 · Créer une page."
            fields:
              - { name: id, widget: hidden }
              - { label: Visible dans le menu, name: visible, widget: boolean, default: true }
              - { label: Emoji, name: emoji, widget: emoji, required: false }
              - { label: Nom, name: label, widget: string }
              - { label: Lien, name: href, widget: string, hint: "Exemple : /evenements.html ou /p/partenaires" }
              - label: Sous-menus
                name: children
                widget: list
                required: false
                label_singular: sous-lien
                summary: "{{emoji}} {{label}}"
                collapsed: auto
                fields:
                  - { label: Emoji, name: emoji, widget: emoji, required: false }
                  - { label: Nom, name: label, widget: string }
                  - { label: Lien, name: href, widget: string }

  - divider: true

  - name: evenements
    label: 02 · Agenda
    icon: calendar_month
    description: "Une fiche = un événement. La date le classe toute seule (à venir ou passé). Publier, attendre 1 minute, Ctrl+F5."
    files:
      - name: agenda
        label: Agenda
        icon: event
        file: evenements.json
        preview_path: evenements.html
        fields:
          - label: À venir
            name: upcoming
            widget: list
            label_singular: événement
            summary: "{{emoji}} {{title}} — {{date}}"
            collapsed: auto
            add_to_top: true
            comment: "Clique + pour ajouter. Remplis d’abord le bloc 1, le reste est optionnel."
            fields: &event_fields
              - { name: id, widget: hidden }
              - label: Date de début
                name: date
                widget: datetime
                type: date
                format: YYYY-MM-DD
                default: "{{now}}"
                hint: "Cette date classe l’événement (à venir ou passé)."
                comment: "1 · L’essentiel"
              - label: Emoji
                name: emoji
                widget: emoji
                required: false
                hint: "Clique Choisir. Il s’affiche devant le titre."
              - label: Titre
                name: title
                widget: string
              - label: Sous-titre
                name: subtitle
                widget: string
                required: false
                hint: "Optionnel."
              - label: Lieu
                name: location
                widget: string
                hint: "Ville, structure, ou « Anniversaire 5 ans »."
              - label: Cacher le lieu
                name: masquerLieu
                widget: boolean
                required: false
                default: false
                hint: "Utile pour un événement privé."
              - label: Accès
                name: acces
                widget: select
                required: false
                hint: "Vide = déduit du champ Public (si tu as écrit Privé)."
                comment: "2 · Public ou privé · Durée"
                options:
                  - { label: "Public — ouvert à tous", value: public }
                  - { label: "Privé — structure / inscription", value: prive }
                  - { label: "Sur invitation", value: invitation }
              - label: Durée
                name: dureeType
                widget: select
                required: false
                hint: "Vide = une journée."
                options:
                  - { label: "Une journée", value: une-journee }
                  - { label: "Une demi-journée", value: demi-journee }
                  - { label: "Plusieurs jours", value: plusieurs-jours }
                  - { label: "Stage / séjour", value: stage }
              - label: Date de fin
                name: dateFin
                widget: datetime
                type: date
                format: YYYY-MM-DD
                required: false
                hint: "Seulement si ça dure plusieurs jours. Vide = un seul jour."
              - label: Afficher sur le site
                name: afficherSite
                widget: boolean
                required: false
                default: true
                hint: "Décoche pour garder la fiche sans la montrer."
              - label: Type
                name: type
                widget: string
                required: false
                hint: "Optionnel. Ex. Atelier, Anniversaire, Stage."
              - label: Statut
                name: statut
                widget: select
                required: false
                hint: "Vide = ouvert."
                options:
                  - { label: "Ouvert", value: ouvert }
                  - { label: "Complet", value: complet }
                  - { label: "Annulé", value: annule }
                  - { label: "Terminé", value: termine }
              - label: Horaires
                name: time
                widget: string
                required: false
                hint: "Ex. 10h-18h"
                comment: "3 · Infos pratiques — tout est optionnel."
              - label: Public
                name: audience
                widget: string
                required: false
                hint: "Ex. Tout public, 6-12 ans, École ouverte."
              - label: Âges
                name: ages
                widget: string
                required: false
                hint: "Optionnel. Ex. 6-10 ans."
              - label: Tarif
                name: price
                widget: string
                required: false
              - label: Inscription
                name: inscription
                widget: string
                required: false
                hint: "Optionnel. Ex. Obligatoire, Sur place."
              - label: Places
                name: places
                widget: string
                required: false
                hint: "Optionnel. Ex. 12 places."
              - label: À prévoir
                name: aPrevoir
                widget: text
                required: false
                hint: "Optionnel."
              - label: Inclus
                name: inclus
                widget: text
                required: false
                hint: "Optionnel."
              - label: Météo / consigne
                name: meteo
                widget: string
                required: false
                hint: "Optionnel."
              - label: Description
                name: description
                widget: text
                hint: "Texte principal. Saut de ligne = paragraphe. **gras**."
                comment: "4 · Textes"
              - label: Encadré mis en avant
                name: details
                widget: string
                required: false
                hint: "Optionnel. Petite phrase colorée."
              - label: Récapitulatif
                name: recap
                widget: text
                required: false
                hint: "Optionnel. Souvenirs, bilan…"
              - label: Note de fin
                name: footer
                widget: text
                required: false
                hint: "Optionnel."
              - label: Photos
                name: photos
                widget: list
                required: false
                label_singular: photo
                summary: "{{caption}}"
                thumbnail: url
                collapsed: auto
                comment: "5 · Photos — la première, ou celle marquée principale, s’affiche en grand. Glisse pour réordonner."
                fields:
                  - label: Photo
                    name: url
                    widget: image
                    choose_url: true
                    hint: "Envoie une image depuis ton ordinateur, ou colle un lien."
                  - label: Légende
                    name: caption
                    widget: string
                    required: false
                    hint: "Texte au survol et sous la photo."
                  - label: Rôle
                    name: role
                    widget: select
                    required: false
                    default: galerie
                    options:
                      - { label: "Photo principale (grande, à côté du texte)", value: principale }
                      - { label: "Galerie (dans le détail)", value: galerie }
                  - label: Place de la photo principale
                    name: position
                    widget: select
                    required: false
                    default: gauche
                    hint: "S’applique à la photo principale."
                    options:
                      - { label: "À gauche du texte", value: gauche }
                      - { label: "À droite du texte", value: droite }
                      - { label: "Au-dessus du texte", value: haut }
                      - { label: "Toute la largeur", value: pleine }
                  - label: Cadrage
                    name: cadrage
                    widget: select
                    required: false
                    default: contenir
                    options:
                      - { label: "Voir toute la photo (sans couper)", value: contenir }
                      - { label: "Remplir le cadre (peut couper les bords)", value: remplir }
                  - label: Zone visible
                    name: focus
                    widget: select
                    required: false
                    default: centre
                    hint: "Si tu remplis le cadre, choisis la partie à garder."
                    options:
                      - { label: "Centre", value: centre }
                      - { label: "Haut", value: haut }
                      - { label: "Bas", value: bas }
                      - { label: "Gauche", value: gauche }
                      - { label: "Droite", value: droite }
                  - label: Rotation
                    name: rotation
                    widget: select
                    required: false
                    default: "0"
                    options:
                      - { label: "Aucune", value: "0" }
                      - { label: "90° à droite", value: "90" }
                      - { label: "180°", value: "180" }
                      - { label: "90° à gauche", value: "270" }
              - label: Style de la galerie
                name: galerie
                widget: select
                required: false
                default: bande
                options:
                  - { label: "Bandeau horizontal (on fait défiler)", value: bande }
                  - { label: "Grille", value: grille }
              - label: Titre du programme
                name: titreProgramme
                widget: string
                required: false
                default: "Au programme"
                hint: "Par défaut : Au programme."
                comment: "6 · Programme — optionnel."
              - label: Emoji du programme
                name: emojiProgramme
                widget: emoji
                required: false
                default: "🎯"
              - label: Programme
                name: program
                widget: list
                required: false
                label_singular: étape
                summary: "{{emoji}} {{title}}"
                collapsed: auto
                fields:
                  - label: Emoji
                    name: emoji
                    widget: emoji
                    required: false
                    hint: "Un emoji par étape, par exemple 🥚 ou 🧪."
                  - label: Titre
                    name: title
                    widget: string
                  - label: Description
                    name: description
                    widget: text
                    hint: "Un saut de ligne = un nouveau paragraphe. **gras** possible."
                  - label: Couleur
                    name: couleur
                    widget: color
                    required: false
                    allowInput: true
                    hint: "Barre en haut de la carte. Vide = vert du site."
              - label: Couleur d’accent
                name: couleur
                widget: color
                required: false
                allowInput: true
                hint: "Filet, dates, pastilles. Vide = vert ou brun automatique."
                comment: "7 · Apparence — optionnel."
              - label: Couleur du titre
                name: couleurTitre
                widget: color
                required: false
                allowInput: true
                hint: "Vide = vert foncé du site."
              - label: Icône décorative
                name: icone
                widget: emoji
                required: false
                hint: "Petit emoji en filigrane, ex. 🍃."
          - label: Passés
            name: past
            widget: list
            label_singular: événement
            summary: "{{emoji}} {{title}} — {{date}}"
            collapsed: auto
            comment: "Même fiche. Une date encore à venir remonte toute seule dans À venir."
            fields: *event_fields

  - divider: true

  - name: pages
    label: 03 · Pages
    icon: web
    description: "Les pages déjà sur le site. Pour en créer une nouvelle : 04 · Créer une page."
    files:
      - name: accueil
        label: Accueil
        icon: home
        file: contenu/accueil.json
        preview_path: /
        fields:
          - label: Bannière d’accueil
            name: hero
            widget: object
            collapsed: false
            summary: "{{titreAvant}} {{titreAccent}}"
            fields:
              - { label: Badge, name: badge, widget: string, hint: "Petite pastille au-dessus du titre, ex. le lieu." }
              - { label: Début du titre, name: titreAvant, widget: string }
              - { label: Mot en couleur, name: titreAccent, widget: string, hint: "Ce mot s’affiche en couleur." }
              - { label: Couleur de ce mot, name: couleurAccent, widget: color, required: false, allowInput: true, hint: "Laisse vide pour garder le vert du site." }
              - { label: Sous-titre, name: sousTitre, widget: string }
              - { label: Texte d’intro, name: texte, widget: text }
              - { label: Bouton 1, name: bouton1, widget: string }
              - { label: Bouton 2, name: bouton2, widget: string }
          - label: Bulles photos
            name: bulles
            widget: list
            label_singular: bulle
            summary: "{{texte}}"
            thumbnail: image
            collapsed: auto
            fields:
              - { label: Photo, name: image, widget: image }
              - { label: Texte, name: texte, widget: text, hint: "Texte au survol de la bulle." }
              - { label: Emoji, name: emoji, widget: emoji, required: false, hint: "Optionnel, affiché sur la bulle." }
          - label: Bandeau défilant
            name: bandeau
            widget: list
            label_singular: phrase
            comment: "Les phrases défilent en bas de la bannière."
            field: { label: Texte, name: texte, widget: string }
          - label: Qui suis-je
            name: qui
            widget: object
            collapsed: auto
            summary: "{{titre}}"
            fields:
              - { label: Étiquette, name: label, widget: string }
              - { label: Titre, name: titre, widget: string }
              - { label: Photo, name: photo, widget: image }
              - { label: Paragraphe 1, name: p1, widget: text, hint: "Le HTML simple est possible, par exemple **gras** via les balises." }
              - { label: Paragraphe 2, name: p2, widget: text }
              - { label: Paragraphe 3, name: p3, widget: text }
          - label: Ma démarche
            name: demarche
            widget: object
            collapsed: auto
            summary: "{{titre}} {{titreAccent}}"
            fields:
              - { label: Étiquette, name: label, widget: string }
              - { label: Titre, name: titre, widget: string }
              - { label: Mot en couleur, name: titreAccent, widget: string }
              - { label: Couleur de ce mot, name: couleurAccent, widget: color, required: false, allowInput: true }
              - { label: Intro, name: intro, widget: string }
              - { label: Citation, name: citation, widget: text }
              - { label: Auteur de la citation, name: citationAuteur, widget: string }
              - label: Piliers
                name: piliers
                widget: list
                label_singular: pilier
                summary: "{{titre}}"
                collapsed: auto
                fields:
                  - { label: Emoji, name: emoji, widget: emoji, required: false }
                  - { label: Titre, name: titre, widget: string }
                  - { label: Texte, name: texte, widget: text }
                  - { label: Couleur, name: couleur, widget: color, required: false, allowInput: true, hint: "Barre à gauche du pilier." }
              - label: Valeurs
                name: valeurs
                widget: list
                label_singular: valeur
                summary: "{{emoji}} {{texte}}"
                collapsed: auto
                fields:
                  - { label: Emoji, name: emoji, widget: emoji, required: false }
                  - { label: Texte, name: texte, widget: string }
          - label: Encadré agenda
            name: agenda
            widget: object
            collapsed: auto
            summary: "{{titre}}"
            fields:
              - { label: Badge, name: badge, widget: string }
              - { label: Titre, name: titre, widget: string }
              - { label: Texte, name: texte, widget: text }
              - { label: Bouton, name: bouton, widget: string }
          - label: Garanties
            name: garanties
            widget: list
            label_singular: garantie
            summary: "{{emoji}} {{titre}}"
            collapsed: auto
            fields:
              - { label: Emoji, name: emoji, widget: emoji, required: false }
              - { label: Titre, name: titre, widget: string }
              - { label: Sous-texte, name: sous, widget: string }
              - { label: Couleur, name: couleur, widget: color, required: false, allowInput: true }

      - name: animations
        label: Animations
        icon: spa
        file: contenu/animations.json
        preview_path: animations.html
        fields:
          - { label: Badge, name: badge, widget: string }
          - { label: Titre, name: titre, widget: string }
          - { label: Mot en couleur, name: titreAccent, widget: string }
          - { label: Couleur de ce mot, name: couleurAccent, widget: color, required: false, allowInput: true }
          - { label: Fin du titre, name: titreFin, widget: string }
          - { label: Sous-titre, name: sousTitre, widget: text }
          - label: Atelier nature
            name: atelier
            widget: object
            collapsed: auto
            summary: "{{titre}} {{titreAccent}}"
            fields:
              - { label: Photo, name: photo, widget: image }
              - { label: Titre, name: titre, widget: string }
              - { label: Mot en couleur, name: titreAccent, widget: string }
              - { label: Couleur de ce mot, name: couleurAccent, widget: color, required: false, allowInput: true }
              - { label: Intro, name: intro, widget: text }
              - { label: Accroche, name: accroche, widget: text }
              - { label: Puces, name: puces, widget: list, label_singular: puce, field: { label: Texte, name: texte, widget: string } }
              - { label: Étiquettes, name: etiquettes, widget: list, label_singular: étiquette, field: { label: Texte, name: texte, widget: string } }
              - { label: Intro catalogue, name: catalogueIntro, widget: text }
              - label: Thématiques
                name: themes
                widget: list
                label_singular: thématique
                summary: "{{emoji}} {{titre}}"
                collapsed: auto
                fields:
                  - { label: Emoji, name: emoji, widget: emoji, required: false }
                  - { label: Titre, name: titre, widget: string }
                  - { label: Texte, name: texte, widget: text }
                  - { label: Couleur, name: couleur, widget: color, required: false, allowInput: true }
          - label: Anniversaires
            name: anniversaires
            widget: object
            collapsed: auto
            summary: "{{titre}} {{titreAccent}}"
            fields:
              - { label: Photo, name: photo, widget: image }
              - { label: Titre, name: titre, widget: string }
              - { label: Mot en couleur, name: titreAccent, widget: string }
              - { label: Couleur de ce mot, name: couleurAccent, widget: color, required: false, allowInput: true }
              - { label: Intro, name: intro, widget: text }
              - { label: Accroche, name: accroche, widget: string }
              - { label: Conclusion, name: conclusion, widget: text }
              - { label: Bouton, name: bouton, widget: string }
              - label: Univers
                name: univers
                widget: list
                label_singular: univers
                summary: "{{emoji}} {{titre}}"
                collapsed: auto
                fields:
                  - { label: Emoji, name: emoji, widget: emoji, required: false }
                  - { label: Titre, name: titre, widget: string }
                  - { label: Texte, name: texte, widget: text }
                  - { label: Couleur, name: couleur, widget: color, required: false, allowInput: true }
          - label: Stages
            name: stages
            widget: object
            collapsed: auto
            summary: "{{titre}} {{titreAccent}}"
            fields:
              - { label: Photo, name: photo, widget: image }
              - { label: Titre, name: titre, widget: string }
              - { label: Mot en couleur, name: titreAccent, widget: string }
              - { label: Couleur de ce mot, name: couleurAccent, widget: color, required: false, allowInput: true }
              - { label: Intro, name: intro, widget: text }
              - { label: Accroche, name: accroche, widget: text }
              - { label: Encadré carnet, name: carnet, widget: text }
              - { label: Infos, name: infos, widget: list, label_singular: info, field: { label: Texte, name: texte, widget: string } }
              - { label: Note, name: note, widget: text }
              - { label: Bouton, name: bouton, widget: string }

      - name: pour_qui
        label: Pour qui ?
        icon: groups
        file: contenu/pour-qui.json
        preview_path: pour-qui.html
        fields:
          - { label: Étiquette, name: label, widget: string }
          - { label: Titre, name: titre, widget: string }
          - { label: Mot en couleur, name: titreAccent, widget: string }
          - { label: Couleur de ce mot, name: couleurAccent, widget: color, required: false, allowInput: true }
          - label: Cartes
            name: cartes
            widget: list
            label_singular: carte
            summary: "{{emoji}} {{titre}}"
            thumbnail: photo
            collapsed: auto
            fields:
              - { label: Emoji, name: emoji, widget: emoji, required: false }
              - { label: Titre, name: titre, widget: string }
              - { label: Texte, name: texte, widget: text }
              - { label: Photo de fond, name: photo, widget: image, required: false }
              - { label: Couleur, name: couleur, widget: color, required: false, allowInput: true, hint: "Teinte du dégradé sur la photo. Vide = vert ou brun automatique." }
              - { label: Étiquettes, name: etiquettes, widget: list, label_singular: étiquette, field: { label: Texte, name: texte, widget: string } }

      - name: contact
        label: Contact
        icon: mail
        file: contenu/contact.json
